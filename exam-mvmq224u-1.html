<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كويز A</title><style>
:root{--bg:#eef1f7;--c:#fff;--t:#171d3a;--m:#667090;--p:#3a3fd1;--pl:#e4e6fb;--b:#d6dbea;--r:#d4442c;--g:#1f9d6b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1020;--c:#171b33;--t:#e9ecfb;--m:#97a0c4;--p:#8a8fff;--pl:#242a55;--b:#2b3260;--r:#ff7a63;--g:#4cd49b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.8 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:640px;margin:auto;padding:0 14px 40px}
.hero{background:var(--p);color:#fff;margin:0 -14px 16px;padding:34px 22px 40px;border-radius:0 0 28px 28px}
@media(prefers-color-scheme:dark){.hero{color:#0d1020}}
.hero h1{margin:0;font-size:26px}.hero p{margin:4px 0 0;opacity:.85;font-size:15px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;margin:12px 0}
h2{font-size:17px;margin:0 0 8px}
label.m,.m{color:var(--m);font-size:14px}
input,textarea,select{width:100%;padding:12px;margin:4px 0 10px;border:1.5px solid var(--b);border-radius:12px;background:var(--bg);color:var(--t);font:inherit;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--pl);border-color:var(--p)}
button{width:100%;padding:13px;margin:5px 0;border:0;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#0d1020}}
button.s{background:transparent;color:var(--p);border:1.5px solid var(--p)}
button.d{background:var(--r);color:#fff}
.role{display:flex;gap:14px;align-items:center;text-align:start}.role i{font-style:normal;font-size:30px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px}
.bar div.r{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pill{background:var(--pl);color:var(--p);padding:2px 14px;border-radius:99px;font-variant-numeric:tabular-nums;direction:ltr}
.pill.low{background:var(--r);color:#fff}
.pr{height:6px;background:var(--b);border-radius:9px;margin-top:8px;overflow:hidden}.pr i{display:block;height:100%;width:0;background:var(--g);transition:width .3s}
.qn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pl);color:var(--p);font-weight:700;font-size:14px;margin-inline-end:8px}
.o{display:flex;gap:10px;align-items:center;padding:11px 14px;border:1.5px solid var(--b);border-radius:12px;margin:8px 0;cursor:pointer}
.o b{display:grid;place-items:center;min-width:26px;height:26px;border-radius:8px;border:1.5px solid var(--b);font-size:13px}
.o.on{border-color:var(--p);background:var(--pl);font-weight:700}.o.on b{background:var(--p);border-color:var(--p);color:#fff}
.ok{color:var(--g);font-weight:700}
#ov{position:fixed;inset:0;background:#0a0c1e;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9}
#ov button{background:#fff;color:#000}
.big{font-size:54px;line-height:1}
#wm{position:fixed;inset:0;z-index:8;pointer-events:none}
#ob{position:fixed;bottom:10px;left:10px;z-index:7;background:#1f9d55;color:#fff;font-size:12px;padding:6px 12px;border-radius:20px}
body{-webkit-touch-callout:none}
@media print{body>*{display:none!important}}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--b);padding:7px;text-align:start}.w{overflow-x:auto}
